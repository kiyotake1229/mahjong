x;color:#8a7440"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg><span class="fd" style="font-size:26px;font-weight:700;color:#1b1a16">既存アプリは上級者向け</span></div><p style="margin:0;font-size:17px;line-height:1.85;color:#3b3a34">説明なしで対局が始まり、広告と課金が多い。「なぜその牌を切るか」は教えてくれない。</p></div></div><div style="font-size:18px;color:#a2a89f;line-height:1.7">遊びたい人は多いのに、「覚えるまで」で脱落する。物語と対局を往復しながら覚える一本にした。</div><div style="position:absolute;left:64px;bottom:30px;display:flex;align-items:center;gap:14px"><span class="fm" style="font-size:13px;color:#a2a89f">No. 02 / 09</span><span style="width:1px;height:14px;background:rgba(201,169,97,.34)"></span><span class="fm" style="font-size:13px;color:#a2a89f">麻雀 4人打ち · 社内説明 · 2026-09-14</span></div><div style="position:absolute;right:64px;bottom:30px"><div style="display:flex;gap:5px"><div style="width:16px;height:22px;border-radius:5px;background:#f4efe2;color:#b8392e;display:grid;place-items:center;font-size:10px;font-weight:700;box-shadow:0 2px 0 #cfc7b3,0 4px 8px rgba(0,0,0,.45);flex:none" class="fd">萬</div><div style="width:16px;height:22px;border-radius:5px;background:#f4efe2;color:#2a63a8;display:grid;place-items:center;font-size:10px;font-weight:700;box-shadow:0 2px 0 #cfc7b3,0 4px 8px rgba(0,0,0,.45);flex:none" class="fd">筒</div><div style="width:16px;height:22px;border-radius:5px;background:#f4efe2;color:#2b7d52;display:grid;place-items:center;font-size:10px;font-weight:700;box-shadow:0 2px 0 #cfc7b3,0 4px 8px rgba(0,0,0,.45);flex:none" class="fd">索</div></div></div></div>
