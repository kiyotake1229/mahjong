    <div class="setrow"><button class="btn ${PAO_ON?'':'gray'} sm" id="setPao">責任払い（パオ）：${PAO_ON?'あり':'なし'}</button><small>大三元・大四喜を確定させる鳴きをさせた人が、ツモなら全額・ロンなら半分を払う</small></div>
    <div class="setrow"><button class="btn ${EXT_ON?'':'gray'} sm" id="setExt">延長（西入）：${EXT_ON?'あり':'なし'}</button><small>終局時に誰も30000点に届いていなければ次の場へ。誰かが届いた局で終わり（4局で打ち切り）</small></div>
    <div class="setrow"><button class="btn ${AGARIYAME?'':'gray'} sm" id="setAgariyame">アガリやめ：${AGARIYAME?'あり':'なし'}</button><small>オーラスで親がトップのままあがる（または聴牌で流局）と、そこで終局</small></div>
    <div class="setrow"><button class="btn ${KUITAN?'':'gray'} sm" id="setKuitan">喰いタン：${KUITAN?'あり':'なし'}</button><small>鳴いた断幺九を役として認める（なし＝門前のみ）</small></div>
    <div class="dojo-sec">あそびやすさ</div>
    <div class="setrow"><button class="btn ${ASSIST?'':'gray'} sm" id="setAssist">おたすけモード：${ASSIST?'ON':'OFF'}</button><small>物語の相手が少し弱くなり、スキルゲージが1.5倍溜まる。慣れるまでONがおすすめ</small></div>
    <div class="setrow"><button class="btn ${SOUND_ON?'':'gray'} sm" id="setSound">音楽・効果音：${SOUND_ON?'あり':'なし'}</button><small>BGMと効果音（端末の中で作っています）</small></div>
    <div class="setrow"><button class="btn ${RED_ON?'':'gray'} sm" id="setRed">赤ドラ：${RED_ON?'あり':'なし'}</button><small>5萬・5筒・5索が各1枚。次の局から</small></div>
    <div class="setrow"><button class="btn ${lsGet('mjChatOff')==='1'?'gray':''} sm" id="setChat">ひとこと：${lsGet('mjChatOff')==='1'?'表示しない':'表示する'}</button><small>オンライン対戦の定型文チャット</small></div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px">
      <button class="btn gray sm" id="setTour">画面の見方</button><button class="btn gray sm" id="setRules">ルールブック</button><button class="btn gray sm" id="setReset">物語を最初から</button></div>
    <div style="margin-top:10px"><button class="linkbtn" id="setErr">不具合の記録（${(()=>{try{return JSON.parse(lsGet('mjErrLog')||'[]').length;}catch(e){return 0;}})()}件）</button>　<span style="font-size:11px;color:var(--muted)">版 ${APP_VER}</span></div>
    <button class="btn" id="setClose" style="margin-top:14px;min-width:160px">とじる</button>`;
  const again=()=>showSettings(back);
  m.querySelectorAll('#setLv button').forEach(b=>b.onclick=()=>{CPU_LV=b.dataset.lv;lsSet('mjCpuLv',CPU_LV);
    if(G&&!G.tutorial&&G.stage==null&&!G.storyFinal&&G.practice==null)G.players.forEach((q,i)=>{if(i&&q.ai!==undefined&&q.ai!==null){q.ai=CPU_LV;q.level=CPU_LV_LEVEL[CPU_LV];}});
    again();});
  document.getElementById('setAutoWin').onclick=()=>{AUTO_WIN=!AUTO_WIN;lsSet('mjAutoWin',AUTO_WIN?'1':'0');again();};
  document.getElementById('setNoCall').onclick=()=>{NO_CALL=!NO_CALL;lsSet('mjNoCall',NO_CALL?'1':'0');again();};
  document.getElementById('setAutoTg').onclick=()=>{AUTO_TG=!AUTO_TG;lsSet('mjAutoTg',AUTO_TG?'1':'0');again();};
  document.getElementById('setTwoTap').onclick=()=>{TWO_TAP=!TWO_TAP;lsSet('mjTwoTap',TWO_TAP?'1':'0');again();};
  document.getElementById('setTileBig').onclick=()=>{TILE_BIG=!TILE_BIG;lsSet('mjTileBig',TILE_BIG?'1':'0');if(G&&G.players)render();again();};
  document.getElementById('setLen').onclick=()=>{GAME_LEN=GAME_LEN==='ton'?'han':'ton';lsSet('mjLen',GAME_LEN);again();};
  document.getElementById('setAbort').onclick=()=>{ABORT_ON=!ABORT_ON;lsSet('mjAbort',ABORT_ON?'1':'0');again();};
  document.getElementById('setNagashi').onclick=()=>{NAGASHI_ON=!NAGASHI_ON;lsSet('mjNagashi',NAGASHI_ON?'1':'0');again();};
  document.getElementById('setPao').onclick=()=>{PAO_ON=!PAO_ON;lsSet('mjPao',PAO_ON?'1':'0');again();};
  document.getElementById('setExt').onclick=()=>{EXT_ON=!EXT_ON;lsSet('mjExt',EXT_ON?'1':'0');again();};
  document.getElementById('setAgariyame').onclick=()=>{AGARIYAME=!AGARIYAME;lsSet('mjAgariyame',AGARIYAME?'1':'0');again();};
  document.getElementById('setKuitan').onclick=()=>{KUITAN=!KUITAN;lsSet('mjKuitan',KUITAN?'1':'0');again();};
  document.getElementById('setAssist').onclick=()=>{ASSIST=!ASSIST;lsSet('mjAssist',ASSIST?'1':'0');if(G&&G.stage!=null&&!G.over){G.players.forEach((p,i)=>{if(i&&p.level)p.level=ASSIST?Math.max(1,p.level-1):p.level+1;});}again();};
  document.getElementById('setSound').onclick=()=>{setSound(!SOUND_ON);again();};
  document.getElementById('setRed').onclick=()=>{RED_ON=!RED_ON;lsSet('mjRed',RED_ON?'1':'0');again();};

  document.getElementById('setReset').onclick=()=>resetStory();
  document.getElementById('setErr').onclick=()=>showErrLog(again);

function showErrLog(back){
  const ov=document.getElementById('overlay');ov.style.display='flex';const m=document.getElementById('modal');
  let arr=[];try{arr=JSON.parse(lsGet('mjErrLog')||'[]');}catch(e){}
  const rows=arr.length?arr.slice().reverse().map(e=>{const c=e.ctx||{};return `<div class="errrow"><b>${esc(String(e.at||'').replace('T',' ').slice(0,19))}</b>　${esc(e.msg)}<br><small>${esc(e.where)}　画面:${esc(c.screen||'')}　節:${esc(String(c.story==null?'':c.story))} ${esc(c.lesson||'')}　戦:${esc(String(c.stage==null?'':c.stage))}　手番:${esc(String(c.turn==null?'':c.turn))}/${esc(c.phase||'')}　版:${esc(c.v||'')}</small></div>`;}).join(''):'<div class="sub">記録はありません</div>';
  m.innerHTML=`<h2>不具合の記録</h2>
    <div class="sub">エラーが起きた時に、この端末の中だけに残る記録です（外には送られません）。進めなくなった時は、この画面の内容を開発側に伝えてください。</div>
    <div class="errlog">${rows}</div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px">
      <button class="btn gray sm" id="errCopy">コピー</button><button class="btn gray sm" id="errClear">消す</button><button class="btn sm" id="errBack">もどる</button></div>`;
  document.getElementById('errCopy').onclick=()=>{const txt=JSON.stringify({v:APP_VER,ua:navigator.userAgent,log:arr},null,1);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('コピーしました'),()=>toast('コピーできませんでした'));else toast('この端末ではコピーできません');};
  document.getElementById('errClear').onclick=()=>{lsSet('mjErrLog','[]');showErrLog(back);};
  document.getElementById('errBack').onclick=()=>{if(back)back();else ov.style.display='none';};
}
/* いま遊んでいる物語の節・戦・レッスン（やり直し用） */
function currentStoryItem(){
  const t=tut||{};
  if(G&&G.stage!=null)return {kind:'stage',i:G.stage,t:'この戦'};
  if(G&&G.storyFinal)return {kind:'final',t:'この一局'};
  if(G&&G.practice!=null)return {kind:'practice',i:G.practice,t:'練習の一局'};
  if(t.mode==='zero'&&t.zero!=null)return {kind:'zero',i:t.zero,t:'この節'};
  if(t.story!=null&&t.story>=0&&G&&G.tutorial)return {kind:'story',i:t.story,t:'この節'};
  if(G&&G.tutorial&&t.lesson&&LESSONS.some(L=>L.id===t.lesson))return {kind:'lesson',id:t.lesson,t:'このレッスン'};
  return null;
}
function restartStoryItem(it){
  hideTalk();document.getElementById('coach').hidden=true;clearHL();
  if(G){G.over=true;G.gen++;}   // 動いている手番のタイマーを止める
  document.getElementById('actions').innerHTML='';
  if(it.kind==='stage')return startStage(it.i);
  if(it.kind==='final')return storyFinalStart();
  if(it.kind==='practice')return practiceStart(it.i);
  if(it.kind==='zero')return zeroStart(it.i);
  if(it.kind==='story')return storyStart(it.i);
  if(it.kind==='lesson'){const L=LESSONS.find(x=>x.id===it.id);if(L){tut={lesson:'',mode:'',phase:'',i:0};L.run();}}
}
function showRecords(back){
  {const _m=document.getElementById('modal');_m.classList.remove('done');_m.onclick=null;}
  const ov=document.getElementById('overlay');ov.style.display='flex';const m=document.getElementById('modal');
  let cur='stat';
  const pct=(a,b)=>b?(Math.round(a/b*1000)/10)+'%':'—';
  const cell=(k,v,sub)=>`<div class="rc-cell"><small>${k}</small><b>${v}</b>${sub?`<i>${esc(sub)}</i>`:''}</div>`;
  const draw=()=>{
    const S=STATS;
    const avgRank=S.games?(S.rank.reduce((a,n,i)=>a+n*(i+1),0)/S.games).toFixed(2):'—';
    const got=YAKU_BOOK.reduce((a,g)=>a+g[1].filter(n=>S.yaku[n]).length,0),all=YAKU_BOOK.reduce((a,g)=>a+g[1].length,0);
    const stat=(S.games||S.hands)?`
      <div class="dojo-sec">対局（半荘・東風戦）</div>
      <div class="rc-grid">${cell('対局数',S.games)}${cell('平均順位',avgRank)}${cell('1位率',pct(S.rank[0],S.games))}${cell('トビ',S.tobi+'回')}${cell('最高持ち点',S.best?S.best.toLocaleString():'—')}</div>
      <div class="rc-bars">${S.rank.map((n,i)=>`<div class="rc-bar"><span>${i+1}位</span><div><i style="width:${S.games?n/S.games*100:0}%"></i></div><b>${n}</b></div>`).join('')}</div>
      <div class="dojo-sec">局</div>
      <div class="rc-grid">${cell('局数',S.hands)}${cell('和了率',pct(S.win,S.hands),'ツモ'+S.tsumo+'／ロン'+S.ron)}${cell('放銃率',pct(S.dealIn,S.hands))}${cell('立直率',pct(S.riichi,S.hands))}${cell('副露率',pct(S.call,S.hands))}${cell('流局時聴牌率',pct(S.drawTen,S.draw))}${cell('平均和了点',S.win?Math.round(S.winPts/S.win).toLocaleString():'—')}${cell('最高打点',S.maxPts?S.maxPts.toLocaleString():'—',S.maxYaku)}${cell('満貫以上',S.mangan+'回')}${cell('役満',S.yakuman+'回')}${cell('流し満貫',S.nagashi+'回')}${cell('途中流局',S.abort+'回')}</div>`
      :'<div class="st-intro">まだ記録がありません。自由対局や物語の戦を打つと、ここに戦績が残ります（レッスンと「みんなで対戦」は数えません）。</div>';
    const yaku='<div class="st-intro">あがった役と回数。名前をタップすると説明。</div>'+YAKU_BOOK.map(([h,list])=>`<div class="dojo-sec">${h}</div><div class="rc-yaku">${list.map(n=>{const c=S.yaku[n]||0;return `<button class="rc-y ${c?'on':''}" data-y="${n}">${n}${c?`<b>${c}</b>`:''}</button>`;}).join('')}</div>`).join('');
    const TABS={stat:{t:'戦績',h:stat},yaku:{t:`役図鑑 ${got}/${all}`,h:yaku}};
    m.innerHTML=`<h2>戦績</h2>
      <div class="rb-tabs">${Object.keys(TABS).map(k=>`<button data-k="${k}" class="${k===cur?'on':''}">${TABS[k].t}</button>`).join('')}</div>
      <div class="rb rc">${TABS[cur].h}</div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button class="btn" id="rcClose" style="min-width:140px">とじる</button><button class="btn gray sm" id="rcReset">記録を消す</button></div>`;
    m.querySelectorAll('.rb-tabs button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;draw();});
    m.querySelectorAll('.rc-y').forEach(b=>b.onclick=()=>{const d=yakuDesc(b.dataset.y);toast(b.dataset.y+(d?'：'+d:''),3800);});
    document.getElementById('rcClose').onclick=()=>{ov.style.display='none';if(back)back();};
    document.getElementById('rcReset').onclick=()=>{if(!confirm('戦績と役図鑑の記録をすべて消しますか？'))return;STATS=blankStats();saveStats();draw();};
  };
  draw();
}
function showPause(){
  if(MP.active)return mpMenu();
  if(!G)return showHome();
  {const _m=document.getElementById('modal');_m.classList.remove('done');_m.onclick=null;}
  const ov=document.getElementById('overlay');ov.style.display='flex';const m=document.getElementById('modal');
  const info=G.tutorial?'レッスン中':`${document.getElementById('roundName').textContent}局 ${document.getElementById('honba').textContent}本場`;
  const cur=currentStoryItem();
  m.innerHTML=`<h2>メニュー</h2><div class="sub">${info}</div>
    <div class="pz">
      <button class="btn blue" id="pzBack">${G.tutorial?'レッスンにもどる':'対局にもどる'}</button>
      <button class="btn gray" id="pzTour">画面の見方</button>
      <button class="btn gray" id="pzRules">ルールブック</button>
      <button class="btn gray" id="pzRec">戦績</button>
      <button class="btn gray" id="pzSet">設定</button>
      ${cur?`<button class="btn gray" id="pzRestart">${cur.t}をやり直す</button>`:''}
      <button class="btn gray" id="pzHome">ホームにもどる</button></div>`;
  if(cur)document.getElementById('pzRestart').onclick=()=>{if(!confirm(cur.t+'を最初からやり直しますか？')){return;}ov.style.display='none';restartStoryItem(cur);};
  document.getElementById('pzBack').onclick=()=>{ov.style.display='none';};
  document.getElementById('pzTour').onclick=()=>{ov.style.display='none';tourFromMenu();};
  document.getElementById('pzRules').onclick=()=>showHelp(showPause);
  document.getElementById('pzRec').onclick=()=>showRecords(showPause);
  document.getElementById('pzSet').onclick=()=>showSettings(showPause);
  document.getElementById('pzHome').onclick=()=>{ov.style.display='none';showHome();};
}

/* 見張り：レッスンの案内が消えたまま、またはCPUの手番が動かないままなら、抜け方を知らせて記録に残す */
let WD={n:0,sig:'',m:0,told:0};
setInterval(()=>{try{
  if(!G||G.over||MP.active)return;
  if(homeOn()||titleOn()||!document.getElementById('vn').hidden||document.getElementById('overlay').style.display==='flex'){WD.n=0;WD.m=0;return;}
  const tell=(why)=>{if(Date.now()-WD.told<120000)return;WD.told=Date.now();errLog('見張り: '+why,'');toast('進めなくなった時は、右上のメニュー →「やり直す」',6000);};
  if(G.tutorial){const busy=document.querySelector('.tile.pulse,.btn.pulse,#actions .btn');
    if(document.getElementById('coach').hidden&&!busy){WD.n++;if(WD.n===5)tell('レッスン中に案内が消えたまま');}else WD.n=0;}
  else{const sig=[G.gen,G.turn,G.phase,G.wall.length,G.players.map(p=>p.discards.length).join('.')].join('|');
    if(sig===WD.sig&&ctlOf(G.turn)==='cpu'){WD.m++;if(WD.m===8)tell('CPUの手番が動かないまま '+sig);}else{WD.sig=sig;WD.m=0;}}
}catch(e){}},5000);

{const mm=/#room=([a-z0-9]{6})/i.exec(location.hash||'');
  if(mm){history.replaceState(null,'',location.pathname+location.search);showHome();setTimeout(()=>showVersus(mm[1].toLowerCase()),300);}
  else showTitle();}

if('serviceWorker' in navigator&&!/^(localhost|127\.0\.0\.1)$/.test(location.hostname))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); // 手元の確認用サーバーでは使わない（別のアプリの記憶と混ざるため）
</script>
