<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="麻雀">
<meta name="theme-color" content="#05070f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@500;600;700&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>麻雀 - 4人打ち</title>
<style>
  :root{
    --bg0:#04060f; --bg1:#090d22; --bg2:#131a40;
    --gold:#f4d98a; --gold2:#c9a24a; --cyan:#5ff0dd; --cyan2:#28b6c9; --rose:#ff5e8a; --violet:#8b7bff;
    --ivory:#f6f2e4; --ink:#eef1fb; --muted:#9aa6c8;
    --line:rgba(130,160,235,.20); --line2:rgba(95,240,221,.35);
    --man:#e5473a; --pin:#3f8bff; --sou:#16b874; --hon:#20263f;
    --f-num:'Orbitron',ui-sans-serif,sans-serif;
    --f-ui:'Rajdhani','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
    --f-jp:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    --f-mincho:'Shippori Mincho','Hiragino Mincho ProN',serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:var(--f-jp);color:var(--ink);touch-action:manipulation;-webkit-font-smoothing:antialiased}
  body{background:
    radial-gradient(120% 80% at 50% -10%,rgba(139,123,255,.16),transparent 55%),
    radial-gradient(ellipse at 50% 32%,var(--bg2) 0%,var(--bg1) 46%,var(--bg0) 100%);
    display:flex;flex-direction:column;position:relative}
  /* 背景：オーロラ＋パースグリッド＋粒子＋ビネット */
  #bg{position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none}
  #bg::before{content:"";position:absolute;inset:-25%;background:
    radial-gradient(closest-side at 22% 26%,rgba(95,240,221,.22),transparent 68%),
    radial-gradient(closest-side at 80% 20%,rgba(255,94,138,.16),transparent 68%),
    radial-gradient(closest-side at 66% 82%,rgba(139,123,255,.20),transparent 68%),
    radial-gradient(closest-side at 30% 88%,rgba(244,217,138,.12),transparent 66%);
    animation:aurora 24s ease-in-out infinite alternate;filter:blur(10px)}
  #bg::after{content:"";position:absolute;left:-60%;right:-60%;bottom:-12%;height:58%;
    background:linear-gradient(transparent,rgba(95,240,221,.06)),
    repeating-linear-gradient(90deg,rgba(130,160,235,.16) 0 1px,transparent 1px 52px),
    repeating-linear-gradient(0deg,rgba(130,160,235,.12) 0 1px,transparent 1px 52px);
    transform:perspective(360px) rotateX(64deg);transform-origin:bottom;
    -webkit-mask-image:linear-gradient(transparent,#000 62%);mask-image:linear-gradient(transparent,#000 62%);
    animation:gridflow 8s linear infinite}
  @keyframes gridflow{to{background-position:0 0,0 52px,52px 0}}
  @keyframes aurora{0%{transform:translate3d(-3%,-2%,0) scale(1.05)}100%{transform:translate3d(4%,3%,0) scale(1.16)}}
  /* 粒子 */
  #fx{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
  #fx i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);opacity:0;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}10%{opacity:.7}90%{opacity:.5}100%{transform:translateY(-104vh) scale(1);opacity:0}}
  /* ビネット＆微粒子ノイズ */
  #vig{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(130% 100% at 50% 40%,transparent 55%,rgba(2,3,10,.55) 100%)}
  .glass{background:linear-gradient(160deg,rgba(30,40,86,.66),rgba(11,16,38,.6));border:1px solid var(--line);
    box-shadow:0 4px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06)}
  #topbar{display:flex;align-items:center;gap:7px;padding:7px 11px;padding-top:calc(7px + env(safe-area-inset-top));
    background:linear-gradient(180deg,rgba(6,9,22,.92),rgba(6,9,22,.35));border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap;
    backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);position:relative;z-index:5}
  #topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
  #topbar .badge{background:linear-gradient(160deg,rgba(30,40,86,.5),rgba(11,16,38,.4));padding:4px 11px;border-radius:11px;border:1px solid var(--line);
    font-family:var(--f-ui);font-weight:600;letter-spacing:.6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  #topbar .badge b{color:var(--gold);font-family:var(--f-num);font-weight:700;font-size:12px;text-shadow:0 0 10px rgba(244,217,138,.4)}
  #dora{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
  #table{position:relative;flex:1;min-height:0}
  .seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px}
  .seat .info{font-family:var(--f-ui);font-weight:600;font-size:11px;background:linear-gradient(160deg,rgba(30,40,86,.78),rgba(11,16,38,.72));padding:3px 12px;border-radius:12px;border:1px solid var(--line);white-space:nowrap;transition:.25s;letter-spacing:.5px;box-shadow:0 2px 12px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05)}
  .seat .info .sc{font-family:var(--f-num);font-weight:700;font-size:10px}
  .seat .info.turn{border-color:var(--gold);color:#fff;font-weight:700;box-shadow:0 0 6px var(--gold),0 0 22px rgba(244,217,138,.75),inset 0 0 14px rgba(244,217,138,.28);animation:turnglow 1.7s ease-in-out infinite}
  @keyframes turnglow{0%,100%{box-shadow:0 0 5px var(--gold),0 0 16px rgba(244,217,138,.5),inset 0 0 10px rgba(244,217,138,.2)}50%{box-shadow:0 0 8px var(--gold),0 0 30px rgba(244,217,138,.9),inset 0 0 16px rgba(244,217,138,.35)}}
  .seat .info .rii{color:var(--rose);font-weight:800;text-shadow:0 0 10px rgba(255,94,138,.95)}
  .seat .info .tenpai{color:var(--cyan);font-weight:800;text-shadow:0 0 10px rgba(95,240,221,.95)}
  .seat .info b{color:var(--gold)}
  .seat .info .dl{opacity:.6;letter-spacing:.8px}
  .seat.bottom{bottom:4px;left:50%;transform:translateX(-50%)}
  .seat.top{top:4px;left:50%;transform:translateX(-50%)}
  .seat.left{left:4px;top:48%;transform:translateY(-50%)}
  .seat.right{right:4px;top:48%;transform:translateY(-50%)}
  .handrow{display:flex;gap:2px;flex-wrap:nowrap}
  .handcol{display:flex;flex-direction:column;gap:2px}
  .sidewrap{display:flex;gap:4px;align-items:flex-start}
  .discards{display:grid;grid-template-columns:repeat(6,auto);gap:2px;justify-content:center;margin-top:2px}
  .discards.side{grid-template-columns:repeat(3,auto)}
  .center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .center svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 0 6px rgba(95,240,221,.55))}
  .center .core{position:absolute;inset:16px;border-radius:50%;
    background:radial-gradient(circle at 50% 38%,rgba(32,46,98,.92),rgba(6,10,26,.95));
    box-shadow:inset 0 0 30px rgba(95,240,221,.14),inset 0 1px 0 rgba(255,255,255,.08),0 8px 30px rgba(0,0,0,.5)}
  .center::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(95,240,221,.14);
    -webkit-mask:conic-gradient(#000 0 8%,transparent 0 25%,#000 0 33%,transparent 0 50%,#000 0 58%,transparent 0 75%,#000 0 83%,transparent 0);
    mask:conic-gradient(#000 0 8%,transparent 0 25%,#000 0 33%,transparent 0 50%,#000 0 58%,transparent 0 75%,#000 0 83%,transparent 0);animation:spin 18s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .center .in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:1px}
  .center .wallcnt{font-family:var(--f-num);font-size:34px;font-weight:900;line-height:1;letter-spacing:1px;
    background:linear-gradient(180deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 12px rgba(95,240,221,.6))}
  .center .lb{font-family:var(--f-ui);font-weight:700;color:var(--muted);font-size:9px;letter-spacing:4px;margin-top:1px}
  .center .sticks{font-family:var(--f-ui);display:flex;gap:8px;font-size:10px;color:var(--gold);margin-top:4px;opacity:.92;letter-spacing:.5px}
  .melds{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
  .meldgroup{display:flex;gap:1px;align-items:flex-end}
  .tile{width:33px;height:45px;border-radius:7px;position:relative;flex:0 0 auto;
    background:linear-gradient(158deg,#fffdf8 0%,#f6f1df 40%,#e4dcc4 100%);
    border:1px solid #cfc7ab;
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -3px 4px rgba(120,110,80,.16),inset 0 0 0 1px rgba(255,255,255,.35),
      0 3px 0 #b0a889,0 5px 2px #9a9375,0 7px 12px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;font-weight:800;line-height:1;user-select:none}
  .tile::before{content:"";position:absolute;inset:0;border-radius:7px;pointer-events:none;
    background:linear-gradient(158deg,rgba(255,255,255,.75),transparent 42%)}
  .tile.sm{width:19px;height:26px;border-radius:4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1.5px 0 #b0a889,0 3px 5px rgba(0,0,0,.45)}
  .tile.sm .num{font-size:12px}.tile.sm .suit{font-size:6px;bottom:1px}
  .tile .face{position:relative;z-index:1;display:block;width:86%;height:86%}
  .tile.sm .face{width:92%;height:92%}
  .tile.back{border:1px solid #37458a;
    background:
      repeating-linear-gradient(125deg,rgba(95,240,221,.08) 0 6px,transparent 6px 12px),
      linear-gradient(150deg,#1e2a63 0%,#141a45 50%,#0b0f2c 100%);
    box-shadow:inset 0 1px 0 rgba(120,150,235,.4),inset 0 0 12px rgba(95,240,221,.18),0 3px 0 #0a0f26,0 5px 10px rgba(0,0,0,.55)}
  .tile.back::before{background:linear-gradient(158deg,rgba(120,150,235,.35),transparent 45%)}
  .tile.back::after{content:"";position:absolute;inset:3px;border:1px solid rgba(95,240,221,.4);border-radius:4px;
    box-shadow:inset 0 0 8px rgba(95,240,221,.3)}
  .tile.rot{transform:rotate(90deg);margin:0 6px}
  .tile.rotm{transform:rotate(90deg)}
  .tile.last{outline:2px solid var(--gold);outline-offset:1px;
    box-shadow:0 0 4px var(--gold),0 0 16px rgba(244,217,138,.8),0 2px 5px rgba(0,0,0,.4);animation:justput .4s cubic-bezier(.2,1.4,.4,1)}
  @keyframes justput{0%{transform:translateY(-10px) scale(1.18);opacity:.4}60%{transform:translateY(2px) scale(.98)}100%{transform:none;opacity:1}}
  .hand .tile{cursor:pointer;transition:transform .14s cubic-bezier(.2,1.2,.4,1),box-shadow .2s,filter .2s}
  .hand .tile:hover{transform:translateY(-11px);filter:brightness(1.05);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),0 0 4px var(--cyan),0 0 20px rgba(95,240,221,.7),0 3px 0 #b0a889,0 10px 16px rgba(0,0,0,.55)}
  .hand .tile.drawn{margin-left:13px;animation:drawpop .3s cubic-bezier(.2,1.3,.4,1);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),0 0 5px var(--cyan),0 0 20px rgba(95,240,221,.85),0 3px 0 #b0a889,0 7px 12px rgba(0,0,0,.5)}
  .hand .tile.drawn::after{content:"";position:absolute;inset:-3px;border-radius:9px;border:1px solid var(--cyan);opacity:.6;animation:ringpulse 1.4s ease-out infinite}
  @keyframes ringpulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.22);opacity:0}}
  @keyframes drawpop{from{transform:translateY(-16px) scale(.82);opacity:.3}to{transform:none;opacity:1}}
  .tile.dim{opacity:.4;filter:saturate(.7)}
  #bottomHand{padding:5px 4px 8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;
    background:linear-gradient(0deg,rgba(8,12,32,.92),rgba(10,14,35,.4));border-top:1px solid var(--line);position:relative;z-index:5}
  /* スキルバー */
  #skillbar{display:flex;align-items:center;gap:8px;max-width:94vw;font-size:11px}
  #gauge{position:relative;width:124px;height:15px;border-radius:8px;background:rgba(95,240,221,.08);border:1px solid var(--line);overflow:hidden;flex:0 0 auto;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
  #gaugeFill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,var(--cyan2),var(--cyan) 55%,var(--gold));box-shadow:0 0 14px rgba(95,240,221,.8);transition:width .5s cubic-bezier(.3,1,.4,1)}
  #gaugeFill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);width:30%;animation:gshine 2.4s linear infinite}
  @keyframes gshine{0%{transform:translateX(-120%)}100%{transform:translateX(430%)}}
  #gauge .gl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:700;font-size:8px;letter-spacing:1.5px;color:#eafffb;text-shadow:0 0 4px rgba(0,0,0,.7)}
  .skill{font-family:var(--f-ui);background:linear-gradient(160deg,rgba(30,40,86,.5),rgba(11,16,38,.4));border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:6px 10px;font-size:11px;font-weight:600;letter-spacing:.5px;cursor:pointer;position:relative;white-space:nowrap;transition:.18s}
  .skill .c{color:var(--cyan);font-family:var(--f-num);font-size:9px;margin-left:4px}
  .skill.on{border-color:var(--cyan);box-shadow:0 0 12px rgba(95,240,221,.6),inset 0 0 10px rgba(95,240,221,.12);background:linear-gradient(160deg,rgba(95,240,221,.16),rgba(20,40,60,.3));color:#fff}
  .skill.on:hover{box-shadow:0 0 18px rgba(95,240,221,.85)}
  .skill.used{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(244,217,138,.5)}
  .skill.used .c{color:var(--gold)}
  .skill:disabled,.skill.off{opacity:.38;cursor:default}
  #guide{font-size:13px;border-radius:20px;padding:6px 15px;text-align:center;max-width:94vw;line-height:1.45;
    background:linear-gradient(160deg,rgba(28,38,80,.6),rgba(12,17,40,.55));border:1px solid var(--line)}
  #guide b{color:var(--gold)}
  #guide .tag{display:inline-block;background:linear-gradient(var(--gold),#d9b95a);color:#3a2c00;font-weight:800;border-radius:6px;padding:0 6px;margin:0 2px;box-shadow:0 0 8px rgba(240,209,122,.5)}
  #myHand{padding-top:15px}
  #myMelds{min-height:0}
  .tile.rec{outline:3px solid var(--gold);outline-offset:1px;box-shadow:0 0 12px rgba(240,209,122,.7),0 2px 0 #b3ab8c}
  .tile.rec::before{content:'おすすめ';position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9px;background:linear-gradient(var(--gold),#d9b95a);color:#3a2c00;padding:0 5px;border-radius:6px;font-weight:800;white-space:nowrap;z-index:2;box-shadow:0 0 8px rgba(240,209,122,.6)}
  .tile.peek{outline:2px solid var(--cyan);outline-offset:1px;box-shadow:0 0 12px rgba(84,230,210,.8)}
  #actions{display:flex;gap:8px;min-height:46px;align-items:center;flex-wrap:wrap;justify-content:center}
  .btn{background:linear-gradient(180deg,#fdf1bd,var(--gold) 60%,var(--gold2));color:#3a2c00;border:none;padding:10px 20px;border-radius:13px;font-family:var(--f-ui);font-weight:700;font-size:15px;cursor:pointer;
    box-shadow:0 3px 0 #a4863a,0 6px 14px rgba(0,0,0,.4),0 0 16px rgba(244,217,138,.5),inset 0 1px 0 rgba(255,255,255,.6);letter-spacing:1px}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a4863a,0 3px 8px rgba(0,0,0,.4)}
  .btn.red{background:linear-gradient(180deg,#ff9ab0,var(--rose) 60%,#d93a68);color:#fff;box-shadow:0 3px 0 #a1284a,0 6px 14px rgba(0,0,0,.4),0 0 20px rgba(255,94,138,.7),inset 0 1px 0 rgba(255,255,255,.4)}
  .btn.gray{background:linear-gradient(180deg,#3c4676,#252b4f);color:var(--ink);box-shadow:0 3px 0 #141833,0 6px 12px rgba(0,0,0,.4),inset 0 0 0 1px var(--line)}
  .btn.blue{background:linear-gradient(180deg,#a3f4ea,var(--cyan) 60%,var(--cyan2));color:#053038;box-shadow:0 3px 0 #1c8a92,0 6px 14px rgba(0,0,0,.4),0 0 20px rgba(95,240,221,.65),inset 0 1px 0 rgba(255,255,255,.5)}
  .btn.sm{padding:7px 13px;font-size:13px;border-radius:10px}
  #overlay{position:fixed;inset:0;background:rgba(4,6,20,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:14px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #modal{background:linear-gradient(160deg,rgba(24,32,68,.96),rgba(9,13,32,.97));border:1px solid rgba(84,230,210,.5);border-radius:18px;padding:20px 22px;max-width:min(94vw,540px);max-height:92vh;overflow:auto;text-align:center;
    box-shadow:0 10px 50px rgba(0,0,0,.7),0 0 30px rgba(84,230,210,.25),inset 0 1px 0 rgba(255,255,255,.06)}
  #modal h2{margin:0 0 6px;color:var(--gold);font-family:var(--f-mincho);font-weight:800;font-size:24px;letter-spacing:2px;text-shadow:0 0 18px rgba(244,217,138,.6)}
  #modal .yaku{text-align:left;display:inline-block;margin:8px 0;font-size:14px;line-height:1.7;min-width:214px}
  #modal .yaku .h{color:var(--cyan);float:right;margin-left:20px;font-family:var(--f-num);font-weight:700;font-size:13px}
  #modal .score{font-family:var(--f-num);font-size:28px;font-weight:900;margin:8px 0;letter-spacing:1px;background:linear-gradient(90deg,var(--gold),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(95,240,221,.4))}
  #modal .sub{font-size:12px;opacity:.8;margin-bottom:6px}
  #modal .handshow{display:flex;gap:2px;justify-content:center;flex-wrap:wrap;margin:8px 0;align-items:flex-end}
  .toast{position:fixed;top:40px;left:50%;transform:translateX(-50%);background:linear-gradient(160deg,rgba(28,38,80,.95),rgba(12,17,40,.95));color:var(--gold);font-weight:800;padding:9px 24px;border-radius:24px;font-size:18px;z-index:60;
    box-shadow:0 6px 24px rgba(0,0,0,.6),0 0 18px rgba(240,209,122,.4);border:1px solid var(--line);display:none}
  .callflash{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);font-size:60px;font-weight:900;color:#fff;z-index:55;pointer-events:none;display:none;animation:flash .6s;
    text-shadow:0 0 24px var(--cyan),0 0 44px rgba(84,230,210,.7)}
  @keyframes flash{0%{transform:translate(-50%,-50%) scale(.3) rotate(-14deg);opacity:0}40%{transform:translate(-50%,-50%) scale(1.15) rotate(-6deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(-6deg);opacity:1}}
  #modal{animation:modalin .45s cubic-bezier(.2,1.2,.35,1)}
  @keyframes modalin{from{transform:translateY(14px) scale(.92);opacity:0}to{transform:none;opacity:1}}
  /* スキル発動カットイン */
  #cutin{position:fixed;left:0;right:0;top:38%;z-index:58;display:none;pointer-events:none;text-align:center}
  #cutin .bar{position:relative;display:inline-block;min-width:60%;padding:14px 40px;
    background:linear-gradient(100deg,transparent,rgba(9,13,34,.92) 12%,rgba(20,28,66,.95) 50%,rgba(9,13,34,.92) 88%,transparent);
    border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
  #cutin .nm{font-family:var(--f-mincho);font-weight:800;font-size:38px;letter-spacing:6px;color:#fff;
    text-shadow:0 0 20px var(--cyan),0 0 40px rgba(95,240,221,.7)}
  #cutin .tg{font-family:var(--f-ui);font-weight:600;font-size:13px;letter-spacing:3px;color:var(--cyan);margin-top:2px}
  #cutin.show{display:block;animation:cutin 1.15s ease forwards}
  @keyframes cutin{0%{opacity:0;transform:translateX(-60px) skewX(-8deg)}14%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateX(40px)}}
  #cutin .sweep{position:absolute;inset:0;overflow:hidden}

<script>
/* ===== 牌 index: 0-8萬 9-17筒 18-26索 27-33字(東南西北白發中) ===== */
const SUIT=['man','pin','sou'], SUITJ=['萬','筒','索'], HON=['東','南','西','北','白','發','中'];
const WINDS=['東','南','西','北'], POS=['あなた','下家','対面','上家'];
const isHonor=t=>t>=27;
const isTermHon=t=>t>=27||t%9===0||t%9===8;
function tileName(t){return t<27?(t%9+1)+['m','p','s'][(t/9)|0]:HON[t-27];}
const KAN_NUM=['一','二','三','四','五','六','七','八','九'];
const PIP={
  1:[[50,70,0]],
  2:[[50,44],[50,96]],
  3:[[30,40],[50,70],[70,100]],
  4:[[34,44],[66,44],[34,96],[66,96]],
  5:[[34,44],[66,44],[50,70],[34,96],[66,96]],
  6:[[34,42],[34,70],[34,98],[66,42],[66,70],[66,98]],
  7:[[30,36],[50,36],[70,36],[36,84],[64,84],[36,110],[64,110]],
  8:[[34,34],[34,58],[34,84],[34,108],[66,34],[66,58],[66,84],[66,108]],
  9:[[30,40],[50,40],[70,40],[30,70],[50,70],[70,70],[30,100],[50,100],[70,100]]
};
function pinDot(cx,cy,r){return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#173c9c"/><circle cx="${cx}" cy="${cy}" r="${r*.7}" fill="#3f8bff"/><circle cx="${cx-r*.26}" cy="${cy-r*.26}" r="${r*.28}" fill="#e6f0ff"/>`;}
function pinSVG(n){
  if(n===1)return `<circle cx="50" cy="70" r="30" fill="#173c9c"/><circle cx="50" cy="70" r="23" fill="#eaf1ff"/><circle cx="50" cy="70" r="16" fill="#3f8bff"/><circle cx="50" cy="70" r="9" fill="#e5473a"/><circle cx="50" cy="70" r="4" fill="#fff"/>`;
  const r=n>=7?10:12;let s='';for(const p of PIP[n])s+=pinDot(p[0],p[1],r);return s;
}
function souStick(cx,cy){return `<rect x="${cx-5.5}" y="${cy-11}" width="11" height="22" rx="5.5" fill="#0e8f57"/><rect x="${cx-3}" y="${cy-9}" width="3" height="18" rx="1.5" fill="#5fe6a6" opacity=".7"/><rect x="${cx-5.5}" y="${cy-2}" width="11" height="4" fill="#0a5f3a"/>`;}
function souSVG(n){
  if(n===1)return `<g transform="translate(50,68)"><path d="M-6,20 Q-24,8 -12,-8 Q-2,-20 10,-13 Q24,-5 13,11 Q6,20 -6,20 Z" fill="#0e8f57"/><circle cx="11" cy="-14" r="8.5" fill="#12a866"/><path d="M17,-17 l14,-4 l-11,10 Z" fill="#e5473a"/><circle cx="12" cy="-15" r="2.2" fill="#063d27"/><path d="M-10,17 q-16,11 -24,5 q11,-1 17,-13 Z" fill="#0a5f3a"/></g>`;
  let s='';for(const p of PIP[n])s+=souStick(p[0],p[1]);return s;
}
function honSVG(h){
  if(h===4)return `<rect x="17" y="22" width="66" height="96" rx="8" fill="none" stroke="#2f7ff0" stroke-width="4.5"/><rect x="27" y="33" width="46" height="74" rx="5" fill="none" stroke="#2f7ff0" stroke-width="2.5" opacity=".7"/>`;
  const col=h<=3?'#232a45':(h===5?'#12a866':'#e5473a');
  return `<text x="50" y="97" text-anchor="middle" font-size="72" font-family="var(--f-mincho)" font-weight="800" fill="${col}">${HON[h]}</text>`;
}
function faceSVG(t){
  let inner;
  if(t<9)inner=`<text x="50" y="58" text-anchor="middle" font-size="52" font-family="var(--f-mincho)" font-weight="800" fill="var(--man)">${KAN_NUM[t]}</text><text x="50" y="124" text-anchor="middle" font-size="44" font-family="var(--f-mincho)" font-weight="800" fill="var(--man)">萬</text>`;
  else if(t<18)inner=pinSVG(t-9+1);
  else if(t<27)inner=souSVG(t-18+1);
  else inner=honSVG(t-27);
  return `<svg class="face" viewBox="0 0 100 140" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
}
function tileEl(t,cls=''){
  const d=document.createElement('div');d.className='tile '+cls;
  if(t<0){d.classList.add('back');return d;}
  d.classList.add(t<27?SUIT[(t/9)|0]:'hon');
  d.innerHTML=faceSVG(t);
  return d;
}
const toCounts=ts=>{const c=new Array(34).fill(0);for(const t of ts)c[t]++;return c;};

/* ===== シャンテン / 和了 ===== */
function dfsBlocks(c,i,budget){
  if(budget===0)return 0;
  while(i<34&&c[i]===0)i++;
  if(i>=34)return 0;
  let best=0;const isN=i<27,r=i%9;
  if(c[i]>=3){c[i]-=3;best=Math.max(best,2+dfsBlocks(c,i,budget-1));c[i]+=3;}
  if(isN&&r<=6&&c[i+1]>0&&c[i+2]>0){c[i]--;c[i+1]--;c[i+2]--;best=Math.max(best,2+dfsBlocks(c,i,budget-1));c[i]++;c[i+1]++;c[i+2]++;}
  if(c[i]>=2){c[i]-=2;best=Math.max(best,1+dfsBlocks(c,i,budget-1));c[i]+=2;}
  if(isN&&r<=7&&c[i+1]>0){c[i]--;c[i+1]--;best=Math.max(best,1+dfsBlocks(c,i,budget-1));c[i]++;c[i+1]++;}
  if(isN&&r<=6&&c[i+2]>0){c[i]--;c[i+2]--;best=Math.max(best,1+dfsBlocks(c,i,budget-1));c[i]++;c[i+2]++;}
  c[i]--;best=Math.max(best,dfsBlocks(c,i,budget));c[i]++;
  return best;
}
function stdShanten(c,mc){mc=mc||0;const b=4-mc;let best=dfsBlocks(c,0,b);
  for(let h=0;h<34;h++)if(c[h]>=2){c[h]-=2;best=Math.max(best,1+dfsBlocks(c,0,b));c[h]+=2;}
  return 8-2*mc-best;}
function chiitoiSh(c){let p=0,k=0;for(let i=0;i<34;i++){if(c[i]>0)k++;if(c[i]>=2)p++;}return 6-p+Math.max(0,7-k);}
function kokushiSh(c){let k=0,p=0;for(let i=0;i<34;i++)if(isTermHon(i)&&c[i]>0){k++;if(c[i]>=2)p=1;}return 13-k-p;}
function shanten(ts,mc){const c=toCounts(ts);let s=stdShanten(c,mc);if(!mc)s=Math.min(s,chiitoiSh(c),kokushiSh(c));return s;}
const isAgari=(ts,mc)=>shanten(ts,mc)===-1;
function waits(ts,mc){const r=[],c=toCounts(ts);for(let t=0;t<34;t++){if(c[t]>=4)continue;if(isAgari(ts.concat([t]),mc))r.push(t);}return r;}

/* ===== 面子分解 ===== */
function decompose(counts){
  const res=[];
  (function rec(c,i,pu,melds,pair){
    while(i<34&&c[i]===0)i++;
    if(i>=34){if(pu)res.push({melds:melds.slice(),pair});return;}
    if(!pu&&c[i]>=2){c[i]-=2;rec(c,i,true,melds,i);c[i]+=2;}
    if(c[i]>=3){c[i]-=3;melds.push({t:'trip',tile:i});rec(c,i,pu,melds,pair);melds.pop();c[i]+=3;}
    if(i<27&&i%9<=6&&c[i+1]>0&&c[i+2]>0){c[i]--;c[i+1]--;c[i+2]--;melds.push({t:'seq',tile:i});rec(c,i,pu,melds,pair);melds.pop();c[i]++;c[i+1]++;c[i+2]++;}
  })(counts.slice(),0,false,[],-1);
  return res;
}

/* ===== ドラ ===== */
function doraFrom(ind){if(ind<27){const b=((ind/9)|0)*9;return b+((ind%9+1)%9);}if(ind<31)return 27+((ind-27+1)%4);return 31+((ind-31+1)%3);}
const liveDora=()=>G.doraInd.map(doraFrom);
const liveUra=()=>G.uraInd.map(doraFrom);
const expandMeld=m=>m.t==='seq'?[m.tile,m.tile+1,m.tile+2]:Array(m.k||3).fill(m.tile);
const isYakuhaiTile=(t,ctx)=>t>=31||(t>=27&&(t-27===ctx.roundWind||t-27===ctx.seatWind));

/* ===== 役 & 符 評価 ===== */
function addExtra(y,ctx){
  if(ctx.riichi)y.push({n:ctx.doubleRiichi?'ダブル立直':'立直',h:ctx.doubleRiichi?2:1});
  if(ctx.ippatsu)y.push({n:'一発',h:1});
  if(ctx.tsumo&&ctx.concealed)y.push({n:'門前清自摸和',h:1});
  if(ctx.haitei&&ctx.tsumo)y.push({n:'海底摸月',h:1});
  if(ctx.houtei&&!ctx.tsumo)y.push({n:'河底撈魚',h:1});
  if(ctx.rinshan&&ctx.tsumo)y.push({n:'嶺上開花',h:1});
}
function addFlags(y,allT,concealed){
  if(allT.every(t=>!isTermHon(t)))y.push({n:'断幺九',h:1});
  const suits=new Set(allT.filter(t=>t<27).map(t=>(t/9)|0)), hasHon=allT.some(t=>t>=27);
  if(suits.size<=1){
    if(hasHon)y.push({n:'混一色',h:concealed?3:2});
    else if(suits.size===1)y.push({n:'清一色',h:concealed?6:5});
  }
  if(allT.every(t=>isTermHon(t))){/* 混老頭など */ y.push({n:'混老頭',h:2});}
}
function addDora(y,allT,ctx){
  let d=0;for(const dt of ctx.doraTiles)for(const t of allT)if(t===dt)d++;
  if(d)y.push({n:'ドラ',h:d,dora:true});
  if(ctx.uraTiles){let u=0;for(const dt of ctx.uraTiles)for(const t of allT)if(t===dt)u++;if(u)y.push({n:'裏ドラ',h:u,dora:true});}
}
function pairFu(pair,ctx){let f=0;if(pair>=31)f+=2;else if(pair>=27){if(pair-27===ctx.roundWind)f+=2;if(pair-27===ctx.seatWind)f+=2;}return f;}
function waitFu(cm,pair,w){
  if(pair===w)return 2;
  for(const m of cm)if(m.t==='seq'){
    if(m.tile+1===w)return 2;
    if(m.tile===w&&m.tile%9===6)return 2;
    if(m.tile+2===w&&m.tile%9===0)return 2;
  }
  return 0;
}
function computeFu(cm,pair,om,ctx,pinfu){
  if(pinfu)return ctx.tsumo?20:30;
  let fu=20;const concealed=om.length===0;
  if(!ctx.tsumo&&concealed)fu+=10;
  if(ctx.tsumo)fu+=2;
  fu+=pairFu(pair,ctx);
  let ronTile=ctx.tsumo?null:ctx.winTile,used=false;
  for(const m of cm){if(m.t!=='trip')continue;const th=isTermHon(m.tile);
    let minko=false;if(!used&&ronTile!==null&&m.tile===ronTile){minko=true;used=true;}
    fu+=minko?(th?4:2):(th?8:4);}
  for(const m of om){if(m.t==='seq')continue;const th=isTermHon(m.tile);
    if(m.kan)fu+=m.concealed?(th?32:16):(th?16:8);else fu+=th?4:2;}
  fu+=waitFu(cm,pair,ctx.winTile);
  return Math.ceil(fu/10)*10;
}
function ryanmenWin(seqs,pair,w){
  if(pair===w)return false;
  return seqs.some(m=>{
    if(m.tile===w)return m.tile%9<=5;
    if(m.tile+2===w)return m.tile%9>=1;
    return false;
  });
}
function evaluate(hand,om,ctx){
  const counts=toCounts(hand),concealed=om.length===0;
  const allTiles=hand.concat(om.flatMap(expandMeld));
  let best=null;
  const consider=(yaku)=>{const real=yaku.filter(v=>!v.dora).reduce((a,b)=>a+b.h,0);if(real===0)return;
    const han=yaku.reduce((a,b)=>a+b.h,0);return han;};
  // 国士無双
  if(concealed){
    const terms=[0,8,9,17,18,26,27,28,29,30,31,32,33];
    if(terms.every(t=>counts[t]>=1)&&terms.some(t=>counts[t]>=2)&&hand.length===14){
      const y=[{n:'国士無双',h:13}];addExtra(y,ctx);
      return {yaku:y,han:y.reduce((a,b)=>a+b.h,0),fu:30};
    }
  }
  // 七対子
  if(concealed){
    let ok=true,p=0;for(let i=0;i<34;i++){if(counts[i]===0)continue;if(counts[i]===2)p++;else{ok=false;break;}}
    if(ok&&p===7){
      const y=[];addExtra(y,ctx);y.push({n:'七対子',h:2});addFlags(y,allTiles,concealed);addDora(y,allTiles,ctx);
      const han=y.reduce((a,b)=>a+b.h,0),real=y.filter(v=>!v.dora).reduce((a,b)=>a+b.h,0);
      if(real>0)best={yaku:y,han,fu:25};
    }
  }
  for(const dec of decompose(counts)){
    const cm=dec.melds.map(m=>({...m,open:false}));
    const omm=om.map(m=>({t:m.t,tile:m.tile,open:!m.concealed,kan:m.kan,concealed:m.concealed}));
    const melds=cm.concat(omm);
    if(melds.length!==4)continue;
    const y=[];addExtra(y,ctx);
    const seqs=melds.filter(m=>m.t==='seq'), trips=melds.filter(m=>m.t==='trip');
    for(const m of trips){
      if(m.tile>=31)y.push({n:HON[m.tile-27],h:1});
      else if(m.tile>=27){if(m.tile-27===ctx.roundWind)y.push({n:'場風 '+HON[m.tile-27],h:1});if(m.tile-27===ctx.seatWind)y.push({n:'自風 '+HON[m.tile-27],h:1});}
    }
    // 三元/風の役満系
    const dr=[31,32,33].filter(t=>trips.some(m=>m.tile===t)).length;
    if(dr===3)y.push({n:'大三元',h:13});
    const pinfu=concealed&&seqs.length===4&&!isYakuhaiTile(dec.pair,ctx)&&ryanmenWin(seqs,dec.pair,ctx.winTile);
    if(pinfu)y.push({n:'平和',h:1});
    if(concealed){const k=seqs.map(m=>m.tile).sort((a,b)=>a-b);let ip=0;for(let i=0;i<k.length-1;i++)if(k[i]===k[i+1]){ip++;i++;}if(ip>=2)y.push({n:'二盃口',h:3});else if(ip>=1)y.push({n:'一盃口',h:1});}
    for(const a of seqs){if(a.tile>=27)continue;const n=a.tile%9;if([n,n+9,n+18].every(b=>seqs.some(m=>m.tile===b))){y.push({n:'三色同順',h:concealed?2:1});break;}}
    for(const a of trips){if(a.tile>=27)continue;const n=a.tile%9;if([n,n+9,n+18].every(b=>trips.some(m=>m.tile===b))){y.push({n:'三色同刻',h:2});break;}}
    for(let s=0;s<3;s++){const b=s*9;if([b,b+3,b+6].every(x=>seqs.some(m=>m.tile===x))){y.push({n:'一気通貫',h:concealed?2:1});break;}}
    if(trips.length===4)y.push({n:'対々和',h:2});
    let anko=0,ru=ctx.tsumo?false:false,ronUsed=false;
    for(const m of cm){if(m.t!=='trip')continue;if(!ctx.tsumo&&!ronUsed&&m.tile===ctx.winTile){ronUsed=true;continue;}anko++;}
    if(anko>=4)y.push({n:'四暗刻',h:13});else if(anko>=3)y.push({n:'三暗刻',h:2});
    addFlags(y,allTiles,concealed);
    addDora(y,allTiles,ctx);
    const real=y.filter(v=>!v.dora).reduce((a,b)=>a+b.h,0);
    if(real===0)continue;
    const han=y.reduce((a,b)=>a+b.h,0);
    const fu=computeFu(cm,dec.pair,om,ctx,pinfu);
    if(!best||han>best.han||(han===best.han&&fu>best.fu))best={yaku:y,han,fu};
  }
  return best;
}

/* ===== 点数 ===== */
function effBase(fu,han){
  if(han>=13)return 8000;if(han>=11)return 6000;if(han>=8)return 4000;if(han>=6)return 3000;if(han>=5)return 2000;
  const b=fu*Math.pow(2,2+han);return Math.min(b,2000);
}
function payments(fu,han,dealer,tsumo){
  const base=effBase(fu,han),r=x=>Math.ceil(x/100)*100;
  if(tsumo){
    if(dealer){const e=r(base*2);return{tsumo:true,dealer:true,each:e,total:e*3};}
    const nd=r(base),d=r(base*2);return{tsumo:true,dealer:false,nd,d,total:nd*2+d};
  }
  const total=dealer?r(base*6):r(base*4);return{tsumo:false,total};
}
function rankName(fu,han){
  if(han>=13)return'役満';if(han>=11)return'三倍満';if(han>=8)return'倍満';if(han>=6)return'跳満';
  if(han>=5||(han>=4&&fu>=40)||(han>=3&&fu>=70))return'満貫';return'';
}

function beep(freq,dur,type,vol,slide){

function godPick(hand,mc,wall){
  const uniq=[...new Set(wall)];const base=shanten(hand,mc);
  let best=-1,bsh=99,buke=-1;
  for(const t of uniq){const sh=shanten(hand.concat([t]),mc);
    if(sh<bsh){bsh=sh;best=t;buke=0;}
  }
  if(best<0||bsh>=base)return -1;// 改善しないなら通常引き
  return best;
}
function drawStep(){

  if(G.turn===0&&G.skill&&G.skill.god){const g=godPick(p.hand,p.melds.length,G.wall);G.skill.god=false;
    if(g>=0){const i=G.wall.lastIndexOf(g);G.wall.splice(i,1);t=g;flash('神引き');}else t=G.wall.pop();}
  else t=G.wall.pop();

/* ===== 反応解決（ロン>ポン/カン>チー） ===== */
function startResolve(fromPid,tile){ronPhase(fromPid,tile);}
function canRon(pid,tile){
  const p=G.players[pid];const h=p.hand.concat([tile]);
  if(!isAgari(h,p.melds.length))return false;
  const w=waits(p.hand,p.melds.length);
  if(p.riichiFuriten||p.tempFuriten)return false;
  if(p.discards.some(d=>w.includes(d)))return false;
  const ctx=buildCtx(pid,false,tile);return !!evaluate(h,p.melds,ctx);
}
function ronPhase(fromPid,tile){
  const claim=[];for(let i=0;i<4;i++)if(i!==fromPid&&canRon(i,tile))claim.push(i);

    renderActions([
      {label:'ロン',cls:'red',fn:()=>win(0,fromPid,false,tile)},
      {label:'スルー',cls:'gray',fn:()=>{const p=G.players[0];if(p.riichi)p.riichiFuriten=true;p.tempFuriten=true;
        const cpu=claim.find(x=>x!==0);if(cpu!==undefined)return win(cpu,fromPid,false,tile);ponPhase(fromPid,tile);}}
    ],false);

    flash('ロン?');return;
  }
  if(claim.length){claim.sort((a,b)=>((a-fromPid+4)%4)-((b-fromPid+4)%4));return win(claim[0],fromPid,false,tile);}
  ponPhase(fromPid,tile);
}
function ponPhase(fromPid,tile){
  let pid=null,canKan=false;
  for(let d=1;d<4;d++){const i=(fromPid+d)%4;const p=G.players[i];if(p.riichi)continue;const c=toCounts(p.hand)[tile];if(c>=2){pid=i;canKan=c>=3;break;}}
  if(pid===0){
    const opts=[{label:'ポン',cls:'',fn:()=>doPon(0,fromPid,tile,false)}];
    if(canKan&&G.wall.length>0)opts.push({label:'カン',cls:'gray',fn:()=>doPon(0,fromPid,tile,true)});
    opts.push({label:'スルー',cls:'gray',fn:()=>{G.offering=false;chiPhase(fromPid,tile);}});
    renderActions(opts,false);
    G.offering=true;setGuide(`同じ<b>${tileName(tile)}</b>が2枚あります。<span class="tag">ポン</span>で3枚そろえて手を早くできます（鳴くと役が必要／不要なら スルー）`);return;
  }else if(pid!==null){
    if(cpuWantsPon(pid,tile)){return doPon(pid,fromPid,tile,false);}
  }

}
function chiCombos(hand,tile){
  if(tile>=27)return[];const c=toCounts(hand),n=tile%9,res=[];
  if(n>=2&&c[tile-2]&&c[tile-1])res.push([tile-2,tile-1]);
  if(n>=1&&n<=7&&c[tile-1]&&c[tile+1])res.push([tile-1,tile+1]);
  if(n<=6&&c[tile+1]&&c[tile+2])res.push([tile+1,tile+2]);
  return res;
}
function chiPhase(fromPid,tile){
  const pid=(fromPid+1)%4;const p=G.players[pid];
  const combos=p.riichi?[]:chiCombos(p.hand,tile);
  if(combos.length){
    if(pid===0){
      const opts=combos.map(cb=>({label:'チー'+(combos.length>1?tileName(cb[0]):''),cls:'',fn:()=>doChi(0,fromPid,tile,cb)}));
      opts.push({label:'スルー',cls:'gray',fn:()=>{G.offering=false;advanceTurn(fromPid);}});
      renderActions(opts,false);
      G.offering=true;setGuide(`数字がつながる牌です。<span class="tag">チー</span>で順子（連番3枚）が作れます（上家からのみ／不要なら スルー）`);return;
    }else{
      const cb=cpuWantsChi(pid,tile,combos);if(cb)return doChi(pid,fromPid,tile,cb);
    }
  }

}
function clearIppatsu(){G.ippatsu=[false,false,false,false];}
function doPon(pid,fromPid,tile,kan){
  const p=G.players[pid],src=G.players[fromPid];
  src.discards.pop();src.discards.push({claimed:true,t:tile});
  let need=kan?3:2,rm=0;p.hand=p.hand.filter(t=>{if(t===tile&&rm<need){rm++;return false;}return true;});
  p.melds.push({t:'trip',tile,k:kan?4:3,concealed:false,kan,from:fromPid,called:tile});
  clearIppatsu();G.callHappened=true;G.offering=false;flash(POS[pid]+(kan?'のカン':'のポン'));sfx.call();
  if(kan){revealKanDora();const rt=G.wall.shift();p.hand.push(rt);p.drawn=rt;p.hand.sort((a,b)=>a-b);G.rinshanFlag=true;}

function doChi(pid,fromPid,tile,combo){
  const p=G.players[pid],src=G.players[fromPid];
  src.discards.pop();src.discards.push({claimed:true,t:tile});
  for(const t of combo){const i=p.hand.indexOf(t);p.hand.splice(i,1);}
  const low=Math.min(tile,...combo);
  p.melds.push({t:'seq',tile:low,k:3,concealed:false,from:fromPid,called:tile});
  clearIppatsu();G.callHappened=true;G.offering=false;flash(POS[pid]+'のチー');sfx.call();
  G.turn=pid;G.phase='discard';p.drawn=-1;p.hand.sort((a,b)=>a-b);
  render();
  if(pid===0)humanTurn();else later(()=>cpuDiscardOnly(pid),450);
}
function advanceTurn(fromPid){
  G.offering=false;
  // 立直宣言が通った（鳴かれず）→ 一発フラグ
  if(G.pendingRiichiDeclarer>=0){G.ippatsu[G.pendingRiichiDeclarer]=true;G.pendingRiichiDeclarer=-1;}
  G.turn=(fromPid+1)%4;G.phase='draw';
  // 自分の一発は次の自分ツモまで。相手番を経るのでここでは消さない。ツモ時drawStep後に消す。
  G.ippatsu[(fromPid+1)%4]&&(G.ippatsu[(fromPid+1)%4]=G.ippatsu[(fromPid+1)%4]); // no-op
  drawStep();
  // 次に手番が来たプレイヤーの一発は、その人がツモを引いた時点で評価後に消える → drawStepで処理

/* ===== CPU ===== */
function cpuTurn(){
  if(G.tutorial)return;
  const pid=G.turn,p=G.players[pid];
  // ツモ評価に使う一発は今のフラグ。引いた後に消す。
  if(isAgari(p.hand,p.melds.length)){
    const ev=evaluate(p.hand,p.melds,buildCtx(pid,true,p.drawn));
    if(ev){G.ippatsu[pid]=false;return win(pid,pid,true,p.drawn);}
  }
  G.ippatsu[pid]=false; // 自分のツモ番を過ぎたので一発消滅
  if(!p.riichi&&p.melds.length===0&&p.score>=1000&&G.wall.length>=4&&shanten(p.hand,0)===0){
    const idx=chooseTenpaiDiscard(p);
    if(idx>=0){p.riichi=true;p.riichiIdx=p.discards.length;p.score-=1000;G.riichiSticks++;
      if(p.discards.length===0&&!G.callHappened)p.doubleRiichi=true;
      G.pendingRiichiDeclarer=pid;sfx.riichi();toast(POS[pid]+' リーチ');
      return doDiscard(pid,idx);}
  }
  if(p.riichi){const i=p.hand.indexOf(p.drawn);return doDiscard(pid,i>=0?i:0);}
  doDiscard(pid,chooseBestDiscard(p));
}
function cpuDiscardOnly(pid){
  if(G.tutorial)return;
  const p=G.players[pid];
  if(isAgari(p.hand,p.melds.length)){const ev=evaluate(p.hand,p.melds,buildCtx(pid,true,p.drawn));if(ev)return win(pid,pid,true,p.drawn);}
  doDiscard(pid,chooseBestDiscard(p));
}
function recommendDiscard(p){
  const hand=p.hand,c=toCounts(hand),seen=new Set();let cands=[];
  for(let i=0;i<hand.length;i++){const t=hand[i];if(seen.has(t))continue;seen.add(t);
    const r=hand.slice();r.splice(i,1);const sh=shanten(r,p.melds.length);
    const isolated=c[t]===1&&(t>=27||(!(t%9>0&&c[t-1])&&!(t%9>1&&c[t-2])&&!(t%9<8&&c[t+1])&&!(t%9<7&&c[t+2])));
    const cc=toCounts(r);let uke=0;for(let d=0;d<34;d++){if(cc[d]>=4)continue;if(shanten(r.concat([d]),p.melds.length)<sh)uke+=(4-cc[d]);}
    cands.push({i,sh,uke,iso:isolated?1:0,hon:t>=27?1:0,term:isTermHon(t)?1:0});
  }
  const minsh=Math.min(...cands.map(x=>x.sh));cands=cands.filter(x=>x.sh===minsh);
  cands.sort((a,b)=>(b.iso*b.term)-(a.iso*a.term)||(b.iso*b.hon)-(a.iso*a.hon)||b.uke-a.uke||b.term-a.term);
  return cands[0].i;
}
function chooseTenpaiDiscard(p){const seen=new Set();for(let i=0;i<p.hand.length;i++){const t=p.hand[i];if(seen.has(t))continue;seen.add(t);const r=p.hand.slice();r.splice(i,1);if(shanten(r,p.melds.length)===0)return i;}return -1;}
function chooseBestDiscard(p){
  let bi=0,bs=99,bu=-1;const seen=new Set();
  for(let i=0;i<p.hand.length;i++){const t=p.hand[i];if(seen.has(t))continue;seen.add(t);
    const r=p.hand.slice();r.splice(i,1);const sh=shanten(r,p.melds.length);
    let uke=0;if(sh<=bs){const c=toCounts(r);for(let d=0;d<34;d++){if(c[d]>=4)continue;if(shanten(r.concat([d]),p.melds.length)<sh)uke+= (4-c[d]);}}
    // 危険度：他家リーチ時は現物寄り（簡易）
    if(sh<bs||(sh===bs&&uke>bu)){bs=sh;bu=uke;bi=i;}
  }
  return bi;
}
function cpuWantsPon(pid,tile){
  const p=G.players[pid];if(p.riichi)return false;
  let rm=0;const rest=p.hand.filter(t=>{if(t===tile&&rm<2){rm++;return false;}return true;});
  const before=shanten(p.hand,p.melds.length),after=shanten(rest,p.melds.length+1);
  if(after>=before)return false;
  const yakuhai=tile>=31||(tile>=27&&(tile-27===p.seatWind||tile-27===G.roundWind));
  if(yakuhai)return true;
  const simple=p.hand.every(t=>!isTermHon(t))&&!isTermHon(tile);
  const suits=new Set(p.hand.concat(p.melds.flatMap(expandMeld)).filter(t=>t<27).map(t=>(t/9)|0));
  const honitsu=suits.size<=1;
  return (simple||honitsu)&&after<before;
}
function cpuWantsChi(pid,tile,combos){
  const p=G.players[pid];if(p.riichi)return null;
  const before=shanten(p.hand,p.melds.length);
  let best=null,bestSh=before;
  for(const cb of combos){
    const rest=p.hand.slice();for(const t of cb){rest.splice(rest.indexOf(t),1);}
    const after=shanten(rest,p.melds.length+1);
    const simple=rest.concat([tile]).every(t=>!isTermHon(t))&&!isTermHon(tile);
    const suits=new Set(p.hand.concat(p.melds.flatMap(expandMeld)).filter(t=>t<27).map(t=>(t/9)|0));
    const honitsu=suits.size<=1;
    if(after<before&&(simple||honitsu)&&after<bestSh){bestSh=after;best=cb;}
  }
  return best;
}

/* ===== 和了・流局 ===== */
function revealKanDora(){const i=G.doraInd.length;if(4+i*2<G.dead.length)G.doraInd.push(G.dead[4+i*2]);if(5+i*2<G.dead.length)G.uraInd.push(G.dead[5+i*2]);}
function win(pid,fromPid,tsumo,winTile){
  if(G.over)return;G.over=true;
  const p=G.players[pid];
  const hand=tsumo?p.hand.slice():p.hand.concat([winTile]);
  const ctx=buildCtx(pid,tsumo,winTile);
  const ev=evaluate(hand,p.melds,ctx);
  if(!ev){G.over=false;if(pid===0)toast('役がありません');return;}
  const pay=payments(ev.fu,ev.han,p.isDealer,tsumo);
  const honbaAdd=(G.honba||0)*(tsumo?300:300);
  let gained=pay.total;
  if(tsumo){
    if(pay.dealer){for(let i=0;i<4;i++)if(i!==pid)G.players[i].score-=pay.each+(G.honba*100);}
    else{for(let i=0;i<4;i++){if(i===pid)continue;const sh=G.players[i].isDealer?pay.d:pay.nd;G.players[i].score-=sh+(G.honba*100);}}
    gained=pay.total+G.honba*300;
  }else{G.players[fromPid].score-=pay.total+G.honba*300;gained=pay.total+G.honba*300;}
  const sticks=G.riichiSticks*1000;p.score+=gained+sticks;G.riichiSticks=0;
  if(pid===0)gaugeAdd(30);
  tsumo?sfx.tsumo():sfx.ron();
  render();
  showResult(pid,fromPid,tsumo,hand,winTile,ev,pay,gained,sticks);
}
function ryuukyoku(){
  G.over=true;
  const tenpai=G.players.map(p=>shanten(p.hand,p.melds.length)===0);
  const tn=tenpai.filter(Boolean).length;
  if(tn>0&&tn<4){const get=3000/tn,give=3000/(4-tn);G.players.forEach((p,i)=>p.score+=tenpai[i]?get:-give);}
  G.advance=!tenpai[G.dealer];G.keepHonba=true;
  render();showDraw(tenpai);
}

function setGuide(h){document.getElementById('guide').innerHTML=h;}
function guideForTurn(){
  const me=G.players[0];
  if(G.over)return setGuide('局が終わりました');
  if(G.turn!==0||G.phase!=='discard')return setGuide('相手の番です…少し待ってね');
  if(isAgari(me.hand,me.melds.length))return setGuide('🎉 <b>あがれます！</b> 下の<span class="tag">ツモ</span>を押そう');
  let best=99,seen=new Set();
  for(let i=0;i<me.hand.length;i++){const t=me.hand[i];if(seen.has(t))continue;seen.add(t);const r=me.hand.slice();r.splice(i,1);const s=shanten(r,me.melds.length);if(s<best)best=s;}
  if(me.riichi){const r=me.hand.slice();const w=waits(me.hand.slice(0,13),me.melds.length);
    return setGuide(`リーチ中。引いた牌をそのまま切ります（あがり牌が来たら自動で<span class="tag">ツモ</span>）`);}
  if(best===0){
    const idx=recommendDiscard(me);const r=me.hand.slice();r.splice(idx,1);
    const w=waits(r,me.melds.length).map(tileName).join(' ');
    setGuide(`<b>テンパイ！</b> あと1枚であがり（待ち: <b>${w||'―'}</b>）。<span class="tag">おすすめ</span>の牌を切ろう`+(me.melds.length===0?'。<b>立直</b>もできます':''));
  }else{
    setGuide(`あがりまで あと <b>${best}</b> 歩。<span class="tag">おすすめ</span>の牌を切って手を進めよう`);
  }
}
function meldEl(m){
  const g=document.createElement('div');g.className='meldgroup';
  if(m.t==='seq'){for(const t of [m.tile,m.tile+1,m.tile+2])g.appendChild(tileEl(t,'sm'+(t===m.called?' rotm':'')));}
  else{const k=m.k||3;for(let i=0;i<k;i++){const concealedBack=m.concealed&&m.kan&&(i===0||i===k-1);g.appendChild(tileEl(concealedBack?-1:m.tile,'sm'));}}
  return g;
}
function discEl(d){if(typeof d==='object')return {tile:d.t,claimed:true};return{tile:d,claimed:false};}
function buildDiscards(p,side){
  const dv=document.createElement('div');dv.className='discards'+(side?' side':'');
  p.discards.forEach((d,i)=>{const info2=discEl(d);const e=tileEl(info2.tile,'sm');
    if(i===p.riichiIdx)e.classList.add('rot');
    if(info2.claimed)e.classList.add('dim');
    if(G.lastDiscard&&G.lastDiscard.pid===p.id&&i===p.discards.length-1&&!info2.claimed)e.classList.add('last');
    dv.appendChild(e);});
  return dv;
}
function buildMelds(p){const mm=document.createElement('div');mm.className='melds';p.melds.forEach(m=>mm.appendChild(meldEl(m)));return mm;}
function renderSeat(id,p,pos){
  const el=document.getElementById(id);el.innerHTML='';
  const info=document.createElement('div');info.className='info'+(G.turn===p.id&&!G.over?' turn':'');
  const side=(pos==='left'||pos==='right');
  const fsTenpai=G.skill&&G.skill.foresight&&p.id!==0&&!p.riichi&&!G.over&&shanten(p.hand,p.melds.length)===0;
  info.innerHTML=`<span class="dl">${POS[p.id]}</span> ${WINDS[p.seatWind]}${p.isDealer?'<b>親</b>':''} <span class="sc">${p.score}</span>`+(p.riichi?' <span class="rii">立</span>':'')+(fsTenpai?' <span class="tenpai">聴</span>':'');
  el.appendChild(info);
  if(side){
    const backs=document.createElement('div');backs.className='handcol';
    for(let i=0;i<p.hand.length;i++)backs.appendChild(tileEl(-1,'sm'));
    const right=document.createElement('div');
    if(p.melds.length)right.appendChild(buildMelds(p));
    right.appendChild(buildDiscards(p,true));
    const wrap=document.createElement('div');wrap.className='sidewrap';
    if(pos==='left'){wrap.appendChild(backs);wrap.appendChild(right);}else{wrap.appendChild(right);wrap.appendChild(backs);}
    el.appendChild(wrap);
  }else{
    if(p.id!==0){const hr=document.createElement('div');hr.className='handrow';for(let i=0;i<p.hand.length;i++)hr.appendChild(tileEl(-1,'sm'));el.appendChild(hr);}
    if(p.melds.length)el.appendChild(buildMelds(p));
    el.appendChild(buildDiscards(p,false));
  }
}

const SKILLS=[
  {id:'peek',cost:30,name:'透視'},
  {id:'foresight',cost:45,name:'千里眼'},
  {id:'god',cost:80,name:'神引き'}
];
function gaugeAdd(n){if(!G||G.tutorial)return;SKILL.gauge=Math.min(100,SKILL.gauge+n);updateSkillbar();}
function updateSkillbar(){
  const bar=document.getElementById('skillbar');if(!bar)return;
  const inTut=G&&G.tutorial;bar.style.display=inTut?'none':'flex';
  const fill=document.getElementById('gaugeFill');fill.style.width=SKILL.gauge+'%';
  document.getElementById('gaugeLbl').textContent='SKILL '+SKILL.gauge;
  const usableTurn=G&&!G.over&&!inTut&&G.turn===0&&G.phase==='discard';
  SKILLS.forEach((s,i)=>{const b=document.getElementById('sk'+i);b.className='skill';
    const used=(s.id==='foresight'&&G.skill&&G.skill.foresight)||(s.id==='god'&&G.skill&&G.skill.god);
    if(used){b.classList.add('used');b.disabled=true;return;}
    const ok=usableTurn&&SKILL.gauge>=s.cost;
    if(ok)b.classList.add('on');else{b.classList.add('off');}
    b.disabled=!ok;
  });
}
function useSkill(i){
  const s=SKILLS[i];
  if(!G||G.over||G.tutorial||G.turn!==0||G.phase!=='discard'||SKILL.gauge<s.cost)return;
  if(s.id==='foresight'&&G.skill.foresight)return;
  if(s.id==='god'&&G.skill.god)return;
  SKILL.gauge-=s.cost;
  if(s.id==='peek'){
    const n=Math.min(3,G.wall.length);const arr=[];for(let k=0;k<n;k++)arr.push(G.wall[G.wall.length-1-k]);
    G.skill.peekTiles=arr;cutin('透視','SEE THE FUTURE ・ 次の3枚');
  }else if(s.id==='foresight'){G.skill.foresight=true;cutin('千里眼','FORESIGHT ・ 相手のテンパイ');}
  else if(s.id==='god'){G.skill.god=true;cutin('神引き','DIVINE DRAW ・ 次のツモが最善牌');}
  sfx.riichi();render();
}

function tutStart(){
  document.getElementById('overlay').style.display='none';
  let wall=[];for(let t=0;t<34;t++)for(let k=0;k<4;k++)wall.push(t);
  const hand0=[1,2,3,4,5,6,15,16,21,22,17,17,33]; // 234m 567m 78p 45s 9p9p 中
  const rm=t=>{const i=wall.indexOf(t);if(i>=0)wall.splice(i,1);};
  hand0.forEach(rm);[14,27,23].forEach(rm); // 引く牌: 6p 東 6s
  const cpu=[[],[],[]];for(let c=0;c<3;c++)for(let k=0;k<13;k++)cpu[c].push(wall.pop());
  for(let i=wall.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[wall[i],wall[j]]=[wall[j],wall[i]];}
  wall.push(23,27,14); // pop順: 6p→東→6s
  const dead=[0,0,0,0,31,30,7,7,7,7,7,7,7,7]; // ドラ表示=白→ドラ發(手に無し)
  const players=[0,1,2,3].map(i=>({id:i,hand:i===0?hand0.slice():cpu[i-1],melds:[],discards:[],riichi:false,doubleRiichi:false,riichiIdx:-1,
    riichiFuriten:false,tempFuriten:false,score:25000,seatWind:i,isDealer:i===0,drawn:-1,pendingRiichi:false}));
  players[0].hand.sort((a,b)=>a-b);
  G={wall,dead,doraInd:[dead[4]],uraInd:[dead[5]],players,dealer:0,round:0,honba:0,turn:0,roundWind:0,
     phase:'draw',over:false,riichiSticks:0,ippatsu:[false,false,false,false],callHappened:false,
     rinshanFlag:false,lastDiscard:null,advance:false,keepHonba:false,pendingRiichiDeclarer:-1,offering:false,
     tutorial:true,tutGate:null,gen:++GEN,skill:{foresight:false,peekTiles:null,god:false}};
  render();
  tut={phase:'intro',i:0};tutIntroShow();
}

  clearHL();
  const last=tut.i>=INTRO.length-1;
  coachShow(INTRO[tut.i],[{label:last?'やってみる':'次へ',cls:'',fn:()=>{
    if(!last){tut.i++;tutIntroShow();}else{tut.phase='play';G.turn=0;G.phase='draw';drawStep();}
  }}],true);
}
function tutorialAfterDiscard(){
  if(G.over)return;
  if(G.pendingRiichiDeclarer===0){G.ippatsu[0]=true;G.pendingRiichiDeclarer=-1;}
  G.turn=0;G.phase='draw';G.tutGate=null;
  drawStep();
}
function tutGuide(){
  if(tut.phase!=='play')return;
  const me=G.players[0];clearHL();
  if(me.pendingRiichi){G.tutGate=me.drawn;
    coachShow(`リーチ宣言する牌を選びます。引いてきた<b>${tileName(me.drawn)}</b>を捨てればOK。<br>光ってる牌をタップ！`,[],true);hlTile(me.drawn);return;}
  if(isAgari(me.hand,me.melds.length)){G.tutGate=null;
    coachShow(`🎉 アガリ牌 <b>${tileName(me.drawn)}</b> が来た！<br>下の<span class="k">ツモ</span>を押してアガリ！`,[],true);hlBtn('ツモ');return;}
  if(me.hand.includes(33)){G.tutGate=33;
    coachShow(`いい牌(<b>${tileName(me.drawn)}</b>)を引きました！でも字牌の<b>中</b>は今バラバラで使えません。<br>光ってる<span class="k">中</span>をタップして捨てよう。`,[],true);hlTile(33);return;}
  let best=99;const seen=new Set();for(let i=0;i<me.hand.length;i++){const t=me.hand[i];if(seen.has(t))continue;seen.add(t);const r=me.hand.slice();r.splice(i,1);best=Math.min(best,shanten(r,0));}
  if(best===0&&!me.riichi){G.tutGate=null;
    const idx=recommendDiscard(me);const rr=me.hand.slice();rr.splice(idx,1);const w=waits(rr,0).map(tileName).join('・');
    coachShow(`<b>テンパイ！</b> あと1枚（待ち: <b>${w}</b>）でアガリ。<br>鳴いてないので<span class="k">立直</span>が使える。下の<b>立直</b>を押そう！`,[],true);hlBtn('立直');return;}
  if(me.riichi){G.tutGate=me.drawn;coachShow(`リーチ中は引いた牌をそのまま捨てます。光ってる牌をタップ。`,[],true);hlTile(me.drawn);return;}
  G.tutGate=null;coachShow(`いらない牌を1枚タップして捨てよう。`,[],true);
}
function endTutorial(){
  document.getElementById('coach').hidden=true;clearHL();
  document.getElementById('overlay').style.display='none';
  lsSet('mjHelpSeen','1');
  G=null;newHand(false);
}
function showChooser(){
  const ov=document.getElementById('overlay');ov.style.display='flex';
  const m=document.getElementById('modal');
  m.innerHTML=`<h2>麻雀へようこそ</h2><div id="chooser" style="max-width:380px">
    <button class="opt" id="optTut"><b>▶ 一緒に練習する（おすすめ）</b><small>コーチの案内で、実際にアガるまでを体験。初めてならコレ</small></button>
    <button class="opt" id="optRead"><b>説明を読む</b><small>ルールを文章でざっと確認</small></button>
    <button class="opt" id="optPlay"><b>そのまま遊ぶ</b><small>すぐ対局を始める</small></button></div>`;
  document.getElementById('optTut').onclick=()=>tutStart();
  document.getElementById('optRead').onclick=()=>showHelp();
  document.getElementById('optPlay').onclick=()=>{ov.style.display='none';lsSet('mjHelpSeen','1');if(!G)newHand(false);};
}

// 空気感の粒子
(function(){const fx=document.getElementById('fx');let h='';
  for(let i=0;i<18;i++){const l=Math.random()*100,d=8+Math.random()*10,delay=-Math.random()*18,s=2+Math.random()*2.5;
    const col=i%3===0?'var(--gold)':(i%3===1?'var(--cyan)':'var(--violet)');
    h+=`<i style="left:${l}%;width:${s}px;height:${s}px;background:${col};box-shadow:0 0 8px ${col};animation-duration:${d}s;animation-delay:${delay}s"></i>`;}
  fx.innerHTML=h;})();

if(lsGet('mjHelpSeen'))newHand(false);
else setTimeout(showChooser,300);
